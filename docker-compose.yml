services:
  provengo-email-service:
    build: .
    container_name: provengo-email-service
    restart: unless-stopped
    ports:
      - "8187:8080"
    environment:
      - PORT=8080
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - DEST_EMAIL=${DEST_EMAIL}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
